services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: buenbocado-postgres
    environment:
      POSTGRES_DB: buenbocado_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buenbocado-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
