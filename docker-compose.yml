services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: buenbocado-postgres
    environment:
      POSTGRES_DB: buenbocado_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buenbocado_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - buenbocado-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buenbocado-redis
    ports:
      - "6379:6379"
    networks:
      - buenbocado-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: buen-bocado-erp-backend:latest
    container_name: buenbocado-backend-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/buenbocado_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - buenbocado-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
    image: buen-bocado-erp-frontend:latest
    container_name: buenbocado-frontend-app
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - buenbocado-network
    restart: unless-stopped

networks:
  buenbocado-network:
    driver: bridge

volumes:
  postgres_data:
